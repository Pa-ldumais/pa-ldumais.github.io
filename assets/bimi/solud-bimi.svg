<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps"
     viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Solud Makerspace</title>

  <!-- Required solid, opaque, edge-to-edge background (BIMI: no transparency) -->
  <rect x="0" y="0" width="300" height="300" fill="#14171F"/>

  <!-- Brain mark, centered, drawn as vector paths (no emoji font, no external refs) -->
  <g fill="#7CFFCB" stroke="#7CFFCB" stroke-width="1">

    <!-- Left hemisphere -->
    <path d="M118 78
             C 92 78 72 96 70 120
             C 55 124 46 138 48 154
             C 38 160 33 174 39 188
             C 34 200 40 216 55 222
             C 56 236 68 248 84 248
             C 90 258 102 264 114 260
             C 124 266 138 264 144 254
             L 144 92
             C 138 82 128 78 118 78 Z"
          fill="#7CFFCB"/>

    <!-- Right hemisphere (mirrored) -->
    <path d="M182 78
             C 208 78 228 96 230 120
             C 245 124 254 138 252 154
             C 262 160 267 174 261 188
             C 266 200 260 216 245 222
             C 244 236 232 248 216 248
             C 210 258 198 264 186 260
             C 176 266 162 264 156 254
             L 156 92
             C 162 82 172 78 182 78 Z"
          fill="#7CFFCB"/>

    <!-- Center split / stem -->
    <path d="M150 92 L150 254" stroke="#14171F" stroke-width="6" fill="none"/>

    <!-- Folds (simple brain-texture strokes, kept minimal for small-size legibility) -->
    <path d="M84 110 C 96 118 96 134 84 142" stroke="#14171F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M64 150 C 78 154 80 170 66 178" stroke="#14171F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M70 196 C 84 198 90 212 78 222" stroke="#14171F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M216 110 C 204 118 204 134 216 142" stroke="#14171F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M236 150 C 222 154 220 170 234 178" stroke="#14171F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M230 196 C 216 198 210 212 222 222" stroke="#14171F" stroke-width="5" fill="none" stroke-linecap="round"/>

  </g>
</svg>
